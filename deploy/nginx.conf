# /etc/nginx/sites-available/tapeguard
#
# HTTP only, on purpose. certbot --nginx rewrites this file to add the TLS
# server block and the redirect once a certificate exists.
#
# Shipping a `listen 443 ssl` block before the certificate is there makes
# `nginx -t` fail, and on a host already serving other sites that failure is
# not contained: the config is global, so a broken file blocks every reload
# until it is removed. The site this is being added for is not yet live; the
# ones beside it are.

limit_req_zone $binary_remote_addr zone=tapeguard_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tapeguard.xyz www.tapeguard.xyz;

    access_log /var/log/nginx/tapeguard.access.log;
    error_log  /var/log/nginx/tapeguard.error.log;

    # certbot writes its challenge here during issuance.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=tapeguard_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A slow upstream must not hold a worker for a minute.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
