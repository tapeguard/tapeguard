# /etc/nginx/sites-available/tapeguard
#
# certbot rewrites the TLS block on first run:
#   certbot --nginx -d tapeguard.xyz -d www.tapeguard.xyz

limit_req_zone $binary_remote_addr zone=tapeguard_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tapeguard.xyz www.tapeguard.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://tapeguard.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tapeguard.xyz;
    return 301 https://tapeguard.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tapeguard.xyz;

    access_log /var/log/nginx/tapeguard.access.log;
    error_log  /var/log/nginx/tapeguard.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=tapeguard_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An upstream that is slow must not hold a worker for a minute.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
