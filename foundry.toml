[profile.default]
src = "contracts"
out = "out"
libs = []
test = "contracts/test"
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
# The digest fixture is written by the Solidity side and read by the
# TypeScript side, so the two implementations are pinned against one
# artifact rather than against each other's assumptions.
fs_permissions = [{ access = "write", path = "./test/fixtures" }]
